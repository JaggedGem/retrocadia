<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="A CRT television playing a pixel landscape, with a console beneath it">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a26"/>
      <stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <linearGradient id="screenSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a4d"/>
      <stop offset="0.55" stop-color="#7a2a6a"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="screenGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142a4d"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <pattern id="heroGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="screenClip"><rect x="150" y="70" width="260" height="180" rx="10"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2fe6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2fe6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="560" height="420" fill="url(#heroBg)"/>
  <rect width="560" height="420" fill="url(#heroGrid)"/>
  <ellipse cx="280" cy="160" rx="230" ry="150" fill="url(#glow)"/>

  <rect x="132" y="52" width="296" height="230" rx="22" fill="#20242f" stroke="#39404f" stroke-width="3"/>
  <rect x="140" y="60" width="280" height="200" rx="16" fill="#0b0d13"/>

  <g clip-path="url(#screenClip)">
    <rect x="150" y="70" width="260" height="180" fill="url(#screenSky)"/>
    <circle cx="300" cy="150" r="34" fill="#ffcb45" opacity="0.9"/>
    <path d="M150 190 L210 130 L250 175 L300 120 L360 185 L410 140 L410 250 L150 250 Z" fill="#3a1f4d" opacity="0.85"/>
    <rect x="150" y="196" width="260" height="54" fill="url(#screenGround)"/>
    <path d="M150 196 H410" stroke="#2fe6ff" stroke-opacity="0.45" stroke-width="2"/>
    <g fill="#2fe6ff">
      <rect x="196" y="200" width="4" height="4"/><rect x="212" y="200" width="4" height="4"/>
      <rect x="228" y="200" width="4" height="4"/><rect x="244" y="200" width="4" height="4"/>
      <rect x="260" y="200" width="4" height="4"/><rect x="276" y="200" width="4" height="4"/>
      <rect x="292" y="200" width="4" height="4"/><rect x="308" y="200" width="4" height="4"/>
      <rect x="324" y="200" width="4" height="4"/><rect x="340" y="200" width="4" height="4"/>
      <rect x="356" y="200" width="4" height="4"/>
    </g>
    <g fill="#ff4f9a">
      <rect x="236" y="160" width="14" height="14"/><rect x="250" y="146" width="18" height="14"/>
      <rect x="268" y="160" width="14" height="14"/>
    </g>
    <rect x="150" y="70" width="260" height="180" fill="url(#scan)"/>
  </g>

  <rect x="150" y="70" width="260" height="180" rx="10" fill="none" stroke="#2fe6ff" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="256" y="286" width="48" height="18" rx="4" fill="#2b3040"/>
  <rect x="196" y="304" width="168" height="18" rx="7" fill="#2b3040"/>

  <rect x="188" y="330" width="184" height="52" rx="12" fill="#1c2030" stroke="#39404f" stroke-width="2"/>
  <rect x="204" y="352" width="52" height="10" rx="5" fill="#3a4152"/>
  <circle cx="344" cy="346" r="6" fill="#ff4f9a"/>
  <circle cx="344" cy="364" r="6" fill="#ffcb45"/>
  <circle cx="326" cy="355" r="6" fill="#2fe6ff"/>

  <rect x="120" y="392" width="320" height="8" rx="4" fill="#2fe6ff" opacity="0.25"/>
</svg>
