<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Stylised illustration of a PlayStation console with a disc and controller">
  <defs>
    <linearGradient id="psBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191c28"/><stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <pattern id="psGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="psShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd1da"/><stop offset="1" stop-color="#9fa2b0"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8e8f2"/><stop offset="0.72" stop-color="#c0c2d2"/>
      <stop offset="0.82" stop-color="#8f7bff"/><stop offset="1" stop-color="#6a5ae0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="320" fill="url(#psBg)"/>
  <rect width="480" height="320" fill="url(#psGrid)"/>
  <ellipse cx="240" cy="150" rx="210" ry="120" fill="#8f7bff" opacity="0.15"/>

  <rect x="86" y="96" width="308" height="150" rx="16" fill="url(#psShell)"/>
  <rect x="86" y="206" width="308" height="40" rx="14" fill="#8e91a0"/>

  <circle cx="176" cy="164" r="66" fill="#b9bcca"/>
  <circle cx="176" cy="164" r="58" fill="url(#disc)"/>
  <circle cx="176" cy="164" r="14" fill="#6f7180"/>
  <circle cx="176" cy="164" r="6" fill="#3b3c48"/>

  <circle cx="300" cy="148" r="12" fill="#5a5d6b"/>
  <circle cx="340" cy="148" r="12" fill="#5a5d6b"/>
  <rect x="300" y="180" width="112" height="12" rx="6" fill="#7c7f8e"/>
  <rect x="300" y="200" width="70" height="8" rx="4" fill="#9a9cab"/>

  <rect x="120" y="216" width="44" height="18" rx="9" fill="#6b6e7c"/>
  <rect x="230" y="216" width="44" height="18" rx="9" fill="#6b6e7c"/>
</svg>
