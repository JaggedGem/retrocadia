      <stop offset="0" stop-color="#191c28"/><stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <pattern id="snesGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="snesShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcdde6"/><stop offset="1" stop-color="#b7b9c8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#snesBg)"/>
